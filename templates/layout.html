<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>{{ title or "BoostOral Docs" }}</title>
  <!-- DaisyUI (includes Tailwind) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-base-100 text-base-content">

  <div class="drawer lg:drawer-open">
    <input id="drawerToggle" type="checkbox" class="drawer-toggle" />

    <!-- Main content -->
    <div class="drawer-content flex flex-col min-h-screen">

      <!-- Navbar: translucent, bottom-only border -->
      <header class="navbar bg-base-100/80 backdrop-blur-md border-b border-base-content/10 sticky top-0 z-30 px-4 h-16">
        <!-- Mobile toggle -->
        <div class="navbar-start lg:hidden">
          <label for="drawerToggle" class="btn btn-square btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </label>
        </div>

        <!-- Improved search bar with better mobile handling -->
        <div class="flex-1 px-2">
          <div class="relative w-full max-w-md hidden sm:block">
            <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
              <i data-lucide="search" class="w-4 h-4 text-base-content/60"></i>
            </div>
            <input
              type="text"
              placeholder="Recherche..."
              class="input input-sm w-full pl-10 pr-4 bg-base-200/70 backdrop-blur-md border border-base-content/10 placeholder-base-content/60 focus:border-primary/40 focus:outline-none focus:ring-2 focus:ring-primary/20"
            />
          </div>
          <!-- Mobile search button -->
          <button class="btn btn-sm btn-ghost btn-circle sm:hidden">
            <i data-lucide="search" class="w-5 h-5"></i>
          </button>
        </div>

        <!-- Improved theme toggle -->
        <div class="navbar-end flex-none">
          <label class="swap swap-rotate btn btn-sm btn-ghost btn-circle" title="Basculer thème">
            <input type="checkbox" class="theme-controller" value="dark" />
            <!-- Moon icon - shown when in dark mode (swap-on) -->
            <svg class="swap-on w-5 h-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
            </svg>
            <!-- Sun icon - shown when in light mode (swap-off) -->
            <svg class="swap-off w-5 h-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
            </svg>
          </label>
        </div>
      </header>

      <!-- Page block -->
      <main class="flex-1 p-6 overflow-y-auto">
        {% block content %}{% endblock %}
      </main>

      <!-- Footer -->
      <footer class="footer p-4 bg-base-200 text-base-content footer-center">
        <p>© 2025 BoostOral. Tous droits réservés.</p>
      </footer>
    </div>

    <!-- Sidebar -->
    <div class="drawer-side">
      <label for="drawerToggle" class="drawer-overlay"></label>
      <aside class="bg-base-100 w-72 min-h-screen p-0 overflow-y-auto border-r border-base-content/10">
        <!-- Branding - adjusted height -->
        <div class="bg-base-200 sticky top-0 z-20 backdrop-blur h-16 flex items-center px-6 border-b border-base-content/10">
          <a href="/" class="flex items-center gap-2 font-bold text-xl">
            <div class="mask mask-squircle bg-primary/20 p-2">
              <i data-lucide="brain-circuit" class="w-5 h-5 text-primary"></i>
            </div>
            <span class="text-base-content">BoostOral</span>
          </a>
        </div>

        <!-- Navigation -->
        <div class="px-0 mt-6">
          <!-- Main Navigation -->
          <div class="mb-4">
            <h2 class="px-4 text-xs font-semibold uppercase opacity-60 mb-3">Navigation</h2>
            <ul class="menu menu-md w-full px-0 gap-1">
              <li>
                <a href="/" class="w-full flex items-center rounded-lg hover:bg-base-200 active:bg-base-300">
                  <i data-lucide="home" class="w-5 h-5 text-blue-500"></i>
                  Accueil
                </a>
              </li>
              
              <!-- Improved Collapsible Menu - Lessons -->
              <li class="w-full">
                <details class="group w-full [&[open]>summary]:bg-base-200">
                  <summary class="list-none w-full flex items-center px-4 py-3 rounded-lg hover:bg-base-200 cursor-pointer after:hidden">
                    <div class="flex items-center gap-2">
                      <i data-lucide="book-open" class="w-5 h-5 text-purple-500"></i>
                      <span>Leçons</span>
                    </div>
                    <div class="ml-auto">
                      <i data-lucide="chevron-right" class="w-4 h-4 transition-transform duration-200 group-open:rotate-90"></i>
                    </div>
                  </summary>
                  <div class="mt-2 ml-4 pl-4 border-l-2 border-base-content/10 space-y-1">
                    <a href="#" class="flex py-2 px-3 rounded-md hover:bg-base-200 active:bg-base-300 text-sm">
                      Leçon 1
                    </a>
                    <a href="#" class="flex py-2 px-3 rounded-md hover:bg-base-200 active:bg-base-300 text-sm">
                      Leçon 2
                    </a>
                  </div>
                </details>
              </li>
              
              <!-- Improved Collapsible Menu - Exercises -->
              <li class="w-full">
                <details class="group w-full [&[open]>summary]:bg-base-200">
                  <summary class="list-none w-full flex items-center px-4 py-3 rounded-lg hover:bg-base-200 cursor-pointer after:hidden">
                    <div class="flex items-center gap-2">
                      <i data-lucide="edit-3" class="w-5 h-5 text-green-500"></i>
                      <span>Exercices</span>
                    </div>
                    <div class="ml-auto">
                      <i data-lucide="chevron-right" class="w-4 h-4 transition-transform duration-200 group-open:rotate-90"></i>
                    </div>
                  </summary>
                  <div class="mt-2 ml-4 pl-4 border-l-2 border-base-content/10 space-y-1">
                    <a href="#" class="flex py-2 px-3 rounded-md hover:bg-base-200 active:bg-base-300 text-sm">
                      Exercice 1
                    </a>
                    <a href="#" class="flex py-2 px-3 rounded-md hover:bg-base-200 active:bg-base-300 text-sm">
                      Exercice 2
                    </a>
                  </div>
                </details>
              </li>
            </ul>
          </div>
          
          <div class="divider my-2"></div>
          
          <!-- Community -->
          <div class="mb-4">
            <h2 class="px-4 text-xs font-semibold uppercase opacity-60 mb-2">Communauté</h2>
            <ul class="menu menu-md w-full px-0 gap-1">
              <li>
                <a href="/forum" class="w-full flex items-center rounded-lg hover:bg-base-200 active:bg-base-300">
                  <i data-lucide="users" class="w-5 h-5 text-indigo-500"></i>
                  Forum
                </a>
              </li>
              <li>
                <a href="/settings" class="w-full flex items-center rounded-lg hover:bg-base-200 active:bg-base-300">
                  <i data-lucide="settings" class="w-5 h-5 text-red-500"></i>
                  Paramètres
                </a>
              </li>
            </ul>
          </div>
          
          <div class="divider my-2"></div>
          
          <!-- About -->
          <div class="mb-4">
            <h2 class="px-4 text-xs font-semibold uppercase opacity-60 mb-2">À propos</h2>
            <ul class="menu menu-md w-full px-0 gap-1">
              <li>
                <a href="/about" class="w-full flex items-center rounded-lg hover:bg-base-200 active:bg-base-300">
                  <i data-lucide="info" class="w-5 h-5 text-gray-500"></i>
                  À propos
                </a>
              </li>
              <li>
                <a href="/logout" class="w-full flex items-center rounded-lg hover:bg-base-200 active:bg-base-300">
                  <i data-lucide="log-out" class="w-5 h-5 text-yellow-500"></i>
                  Déconnexion
                </a>
              </li>
            </ul>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Lucide + theme-change -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="https://cdn.jsdelivr.net/npm/theme-change@latest"></script>
  <script>themeChange(false);</script>
</body>
</html>
